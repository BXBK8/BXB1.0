<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BXB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #090302;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    .mesh-bg {
      position: fixed;
      inset: -15%;
      z-index: 0;
      filter: blur(90px) saturate(1.25);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .blob-1 {
      width: 55vw; height: 55vw;
      top: -10%; left: -5%;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.95) 0%, rgba(255, 69, 0, 0) 70%);
      animation: drift1 14s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 50vw; height: 50vw;
      top: 10%; right: -10%;
      background: radial-gradient(circle, rgba(255, 119, 0, 0.75) 0%, rgba(255, 119, 0, 0) 70%);
      animation: drift2 18s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 60vw; height: 60vw;
      bottom: -20%; left: 20%;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.85) 0%, rgba(160, 20, 0, 0) 70%);
      animation: drift3 16s ease-in-out infinite alternate;
    }

    .blob-4 {
      width: 45vw; height: 45vw;
      bottom: 5%; right: 10%;
      background: radial-gradient(circle, rgba(190, 25, 0, 0.9) 0%, rgba(190, 25, 0, 0) 70%);
      animation: drift4 20s ease-in-out infinite alternate;
    }

    .blob-cursor {
      width: 42vw; height: 42vw;
      top: 0; left: 0;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.85) 0%, rgba(255, 69, 0, 0) 68%);
      transform: translate(-50%, -50%);
    }

    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(18vw, 12vh) scale(1.15); }
      100% { transform: translate(8vw, 25vh) scale(0.95); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1.05); }
      50%  { transform: translate(-20vw, 16vh) scale(0.9); }
      100% { transform: translate(-10vw, -8vh) scale(1.15); }
    }
    @keyframes drift3 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-15vw, -18vh) scale(1.18); }
      100% { transform: translate(16vw, -10vh) scale(0.92); }
    }
    @keyframes drift4 {
      0%   { transform: translate(0, 0) scale(1.1); }
      50%  { transform: translate(-14vw, -14vh) scale(0.95); }
      100% { transform: translate(10vw, -22vh) scale(1.08); }
    }

    .intro-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      transition: opacity 0.8s ease;
    }

    .intro-layer.done {
      opacity: 0;
      pointer-events: none;
    }

    #logoCanvas {
      display: block;
      cursor: crosshair;
    }

    .hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 69, 0, 0.35);
      padding: 8px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .site-layer {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .site-layer.revealed {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .site-layer h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .site-layer p {
      margin-top: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
    }

    .replay-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: 1px solid rgba(255, 69, 0, 0.5);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .replay-btn:hover {
      background: rgba(255, 69, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-cursor" id="cursorBlob"></div>
  </div>

  <div class="site-layer" id="siteLayer">
    <div>
      <h1>BXB</h1>
      <p>Site revealed. Ready for what we build next.</p>
    </div>
    <button class="replay-btn" id="replayBtn">Replay Intro</button>
  </div>

  <div class="intro-layer" id="introLayer">
    <canvas id="logoCanvas"></canvas>
    <div class="hint" id="hint">Click the logo to shatter · <span id="pct">0</span>%</div>
  </div>

  <script>
    const cursorBlob = document.getElementById('cursorBlob');
    let targetX = window.innerWidth * 0.5;
    let targetY = window.innerHeight * 0.5;
    let currentX = targetX;
    let currentY = targetY;
    let mouseX = -9999;
    let mouseY = -9999;

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      targetX = e.clientX + window.innerWidth * 0.15;
      targetY = e.clientY + window.innerHeight * 0.15;
    });

    function animateBg() {
      currentX += (targetX - currentX) * 0.06;
      currentY += (targetY - currentY) * 0.06;
      cursorBlob.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;
      requestAnimationFrame(animateBg);
    }
    animateBg();

    const LOGO_MAP = [
      "..............KKKKKKKKKKK.......................................",
      ".............KDDKDKKDKDDKKSS....................................",
      "............KDKKOKOOKOKKOKKKS...................................",
      "............KDKKOKOOKOKKOKKKS...................................",
      "..........KKDKOOKOKKOKOOKOKKKKKKKKKKKKKKKKKKK...................",
      "..........KKKOKKOKOOKOKKOKOOKDSKDKKDKDDKDKKDKKKS................",
      "..........KKDKOOKOKKOKOOKOKKOKDOKOOKOKKOKOOKOKKKS...............",
      "..........KKDKOOKOKKOKOOKOKKOKDOKOOKOKKOKOOKOKKKS...............",
      "..........KKKOKKOKOOKOKKOKOOKODKOKKOKOOKOKKOKDDKSSS.............",
      "..........KKDKDDKDKKDKDDKDKKDKDDKDDKDKKOKOOKOKKKSSS.............",
      "......KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKOKKOKDDKSSS.............",
      "......KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKOKKOKDDKSSS.............",
      ".....KDDKDKKDKDDKDKKDKDDKDKKDKDDKDDKDKKKKOOKOKKKSSS.............",
      ".....KKKOKOOKOKKOKOOKOKKOKOOKODKOKKOKDDKDKKOKDDKSSS.............",
      ".....KDDKOKKOKOOKOKKOKOOKOKKOKDOKOOKOKKKKOOKOKKKSSS.............",
      ".....KDDKOKKOKOOKOKKOKOOKOKKOKDOKOOKOKKKKOOKOKKKSSS.............",
      "......KKDKOOKOKKOKOOKOKKOKOOKODKOKKOKOOKKKKOKDDKSSS.............",
      "......KKKOKKOKOOKOKKOKOOKOKKOKDOKOOKOKKDKDDKOKKKSSS.............",
      "......KKKOKKOKOOKOKKOKOOKOKKOKDOKOOKOKKDKDDKOKKKSSS.............",
      "......KKDKOOKOKKOKOOKOKKOKOOKODKOKKOKOOKKKKOKDDKSSS.............",
      "........KDKKOKOOKOKKOKOOKOKKOKDOKOOKOKKOKKKKOKKKSSS.............",
      "........KKOOKOKKOKOOKOKKOKOOKODKOKKOKOOKDKKDKDDKSSS.............",
      "........KKOOKOKKOKOOKOKKOKOOKODKOKKOKOOKDKKDKDDKSSS.............",
      "........KDKKOKOOKOKKOKOOKOKKOKDOKOOKOKKOKKKKOKKKSSS.............",
      ".........KDDKOKKOKOOKOKKOKOOKODKOKKOKOOKOKKKKDDKSSS.............",
      ".........KKKOKOOKOKKOKOOKOKKOKDOKOOKOKKOKDDKDKKKSSS.............",
      ".........KKKOKOOKOKKOKOOKOKKOKDOKOOKOKKOKDDKDKKKSSS.............",
      ".........KDDKOKKOKOOKOKKOKOOKODKOKKOKOOKOKKKKDDKSSS.............",
      "..........KKDKOOKOKKOKOOKOKKOKDOKOOKOKKOKOOKKKKKSSS.............",
      "..........KKKOKKOKOOKOKKOKOOKODKOKKOKOOKOKKDKDDKSSS.............",
      "..........KKKOKKOKOOKOKKOKOOKODKOKKOKOOKOKKDKDDKSSS.............",
      "..........KKDKDDKDKKDKDDKDKKDKDDKDDKDKKDKDDKKKKKSSS.............",
      "............KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKSSSS.............",
      "..............SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS...............",
      "..............SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS...............",
      "................................................................",
      "................................................................",
      "................................................................",
      "................................................................",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOKKKKKKKOOOOOSKOOOOO.....SKKOOOOOKKOOOOOKKKKKKKOOOOO...",
      "..SKKOOOOO....SKKOOOOOSKOOOOOK..KKKKKOOOOOKKOOOOO....SKKOOOOO...",
      "..SKKOOOOO....SKKOOOOO.KKKKOOOOOKKOOOOOK.SKKOOOOO....SKKOOOOO...",
      "..SKKOOOOO....SKKOOOOO..SKKOOOOOKKOOOOO..SKKOOOOO....SKKOOOOO...",
      "..SKKOOOOOKKKKKKKOOOOO..SKKOOOOOKKOOOOO..SKKOOOOOKKKKKKKOOOOO...",
      "..SKKOOOOOOOOOOOOOOO.....KKKKOOOOOOOO....SKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOOOOOOOOOOO.....KKKKOOOOOOOO....SKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOKKKKKKKOOOOO..SKKOOOOOKKOOOOO..SKKOOOOOKKKKKKKOOOOO...",
      "..SKKOOOOO....SKKOOOOO..SKKOOOOOKKOOOOO..SKKOOOOO....SKKOOOOO...",
      "..SKKOOOOO....SKKOOOOO.KKKKOOOOOKKOOOOOK.SKKOOOOO....SKKOOOOO...",
      "..SKKOOOOO....SKKOOOOOSKOOOOOK..KKKKKOOOOOKKOOOOO....SKKOOOOO...",
      "..SKKOOOOOKKKKKKKOOOOOSKOOOOO.....SKKOOOOOKKOOOOOKKKKKKKOOOOO...",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "..SKKOOOOOOOOOOOOOOO..SKOOOOO.....SKKOOOOOKKOOOOOOOOOOOOOOO.....",
      "...KKKKKKKKKKKKKKK.....KKKKS.......KKKKK..KKKKKKKKKKKKKKK......."
    ];

    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');
    const introLayer = document.getElementById('introLayer');
    const siteLayer = document.getElementById('siteLayer');
    const hint = document.getElementById('hint');
    const pctEl = document.getElementById('pct');
    const replayBtn = document.getElementById('replayBtn');

    const rows = LOGO_MAP.length;
    const cols = LOGO_MAP[0].length;

    const COLORS = {
      O: [255, 92, 20],
      D: [140, 34, 0],
      K: [12, 5, 3],
      S: [0, 0, 0]
    };

    let particles = [];
    let clearedCount = 0;
    let autoCompleting = false;
    let startTime = performance.now();

    function initParticles() {
      particles = [];
      clearedCount = 0;
      autoCompleting = false;
      pctEl.textContent = '0';
      hint.style.opacity = '1';
      introLayer.classList.remove('done');
      siteLayer.classList.remove('revealed');
      startTime = performance.now();

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = LOGO_MAP[r][c];
          if (ch === '.') continue;
          const distFromCenter = Math.hypot((c - cols / 2) / cols, (r - rows / 2) / rows);
          const angle = Math.random() * Math.PI * 2;
          const scatter = 18 + Math.random() * 42;
          particles.push({
            r, c, type: ch,
            char: Math.random() > 0.5 ? '1' : '0',
            delay: distFromCenter * 1.35 + Math.random() * 0.55,
            duration: 0.7 + Math.random() * 0.5,
            offsetX: Math.cos(angle) * scatter,
            offsetY: Math.sin(angle) * scatter,
            flipTimer: Math.random() * 100,
            flipSpeed: 45 + Math.random() * 70,
            shattered: false,
            sx: 0, sy: 0, vx: 0, vy: 0, life: 1
          });
        }
      }
    }

    let cellSize = 8;
    let dpr = 1;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const maxSize = Math.min(window.innerWidth * 0.82, window.innerHeight * 0.78, 540);
      cellSize = maxSize / cols;
      const w = cols * cellSize;
      const h = rows * cellSize;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initParticles();

    function triggerAutoComplete() {
      if (autoCompleting) return;
      autoCompleting = true;
      hint.style.opacity = '0';

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!p.shattered) {
          p.shattered = true;
          p.sx = (p.c + 0.5) * cellSize;
          p.sy = (p.r + 0.5) * cellSize;
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 4.5;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed - 1.5;
          p.life = 1;
        }
      }

      setTimeout(() => {
        introLayer.classList.add('done');
        siteLayer.classList.add('revealed');
      }, 450);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (autoCompleting) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const blastRadius = Math.max(54, cellSize * 9);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.shattered) continue;
        const bx = (p.c + 0.5) * cellSize;
        const by = (p.r + 0.5) * cellSize;
        const dx = bx - clickX;
        const dy = by - clickY;
        const dist = Math.hypot(dx, dy);

        if (dist < blastRadius) {
          p.shattered = true;
          clearedCount++;
          p.sx = bx;
          p.sy = by;
          const force = (1 - dist / blastRadius) * 8 + 2;
          const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.9;
          p.vx = Math.cos(angle) * force;
          p.vy = Math.sin(angle) * force - 2.2;
          p.life = 1;
        }
      }

      const pct = Math.min(100, Math.round((clearedCount / particles.length) * 100));
      pctEl.textContent = pct;

      if (clearedCount / particles.length >= 0.8) {
        triggerAutoComplete();
      }
    });

    replayBtn.addEventListener('click', initParticles);

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function render(now) {
      const elapsed = (now - startTime) / 1000;
      const rect = canvas.getBoundingClientRect();
      const localMouseX = mouseX - rect.left;
      const localMouseY = mouseY - rect.top;

      ctx.clearRect(0, 0, cols * cellSize, rows * cellSize);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.max(7, cellSize * 1.05)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        if (p.shattered) {
          if (p.life <= 0) continue;
          p.sx += p.vx;
          p.sy += p.vy;
          p.vy += 0.14;
          p.vx *= 0.98;
          p.life -= autoCompleting ? 0.032 : 0.024;
          if (Math.random() < 0.25) p.char = p.char === '0' ? '1' : '0';

          const rgb = COLORS[p.type];
          const baseAlpha = p.type === 'S' ? 0.35 : 1;
          ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${Math.max(0, p.life) * baseAlpha})`;
          ctx.fillText(p.char, p.sx, p.sy);
          continue;
        }

        const t = Math.max(0, Math.min(1, (elapsed - p.delay) / p.duration));
        if (t <= 0) continue;

        const eased = easeOutCubic(t);
        const baseX = (p.c + 0.5) * cellSize;
        const baseY = (p.r + 0.5) * cellSize;

        const dx = baseX - localMouseX;
        const dy = baseY - localMouseY;
        const dist = Math.hypot(dx, dy);
        const hoverForce = dist < 60 ? (1 - dist / 60) : 0;

        if (t < 0.96 || hoverForce > 0.2 || Math.random() < 0.0025) {
          if (now - p.flipTimer > p.flipSpeed) {
            p.char = p.char === '0' ? '1' : '0';
            p.flipTimer = now;
          }
        }

        const x = baseX + p.offsetX * (1 - eased) + (hoverForce > 0 ? (dx / (dist || 1)) * hoverForce * 5 : 0);
        const y = baseY + p.offsetY * (1 - eased) + (hoverForce > 0 ? (dy / (dist || 1)) * hoverForce * 5 : 0);

        const rgb = COLORS[p.type];
        const baseAlpha = p.type === 'S' ? 0.35 : 1;
        const alpha = baseAlpha * Math.min(1, t * 1.6);

        if (t < 0.92 && p.type === 'O') {
          ctx.fillStyle = `rgba(255, 175, 90, ${alpha})`;
        } else {
          ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
        }

        ctx.fillText(p.char, x, y);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
