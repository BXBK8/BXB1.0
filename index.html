<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BXB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />
    <style>
    @font-face {
      font-family: 'Departure Mono';
      src: url('./DepartureMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Departure Mono', ui-monospace, monospace;
      font-weight: 400;
      text-transform: uppercase;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #090302;
      color: #000000;
    }

    .mesh-bg {
      position: fixed;
      inset: -15%;
      z-index: 0;
      filter: blur(90px) saturate(1.25);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .blob-1 {
      width: 55vw; height: 55vw;
      top: -10%; left: -5%;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.95) 0%, rgba(255, 69, 0, 0) 70%);
      animation: drift1 14s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 50vw; height: 50vw;
      top: 10%; right: -10%;
      background: radial-gradient(circle, rgba(255, 119, 0, 0.75) 0%, rgba(255, 119, 0, 0) 70%);
      animation: drift2 18s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 60vw; height: 60vw;
      bottom: -20%; left: 20%;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.85) 0%, rgba(160, 20, 0, 0) 70%);
      animation: drift3 16s ease-in-out infinite alternate;
    }

    .blob-4 {
      width: 45vw; height: 45vw;
      bottom: 5%; right: 10%;
      background: radial-gradient(circle, rgba(190, 25, 0, 0.9) 0%, rgba(190, 25, 0, 0) 70%);
      animation: drift4 20s ease-in-out infinite alternate;
    }

    .blob-cursor {
      width: 42vw; height: 42vw;
      top: 0; left: 0;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.85) 0%, rgba(255, 69, 0, 0) 68%);
      transform: translate(-50%, -50%);
    }

    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(18vw, 12vh) scale(1.15); }
      100% { transform: translate(8vw, 25vh) scale(0.95); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1.05); }
      50%  { transform: translate(-20vw, 16vh) scale(0.9); }
      100% { transform: translate(-10vw, -8vh) scale(1.15); }
    }
    @keyframes drift3 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-15vw, -18vh) scale(1.18); }
      100% { transform: translate(16vw, -10vh) scale(0.92); }
    }
    @keyframes drift4 {
      0%   { transform: translate(0, 0) scale(1.1); }
      50%  { transform: translate(-14vw, -14vh) scale(0.95); }
      100% { transform: translate(10vw, -22vh) scale(1.08); }
    }

    .intro-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      transition: opacity 0.6s ease;
    }

    .intro-layer.no-pointer {
      pointer-events: none;
    }

    .intro-layer.done {
      opacity: 0;
      pointer-events: none;
    }

    #logoCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: #000000;
      background: rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .site-layer {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .site-layer.revealed {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .glass-nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 50vw;
      width: max(50vw, max-content); max-width: 90vw;
      min-width: 320px;
      height: 60px;
      padding: 0 28px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      color: #000000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      white-space: nowrap;
      color: #000000;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.55;
    }

    .site-layer h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.14em;
      color: #000000;
    }

    .site-layer p {
      margin-top: 0.75rem;
      color: #000000;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .replay-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.22);
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-cursor" id="cursorBlob"></div>
  </div>

  <div class="site-layer" id="siteLayer">
    <nav class="glass-nav">
      <div class="nav-links" style="width: 100%; justify-content: space-between; gap: 18px;">
        <a href="#">WHY ?</a>
        <a href="#">PORTFOLIO</a>
        <a href="#">STORE</a>
        <a href="#">BESPOKE</a>
        <a href="#">OFFICE</a>
        <a href="#">CONNECT</a>
      </div>
    </nav>

    <div>
      <h1>BXB</h1>
      <p>Site revealed. Ready for what we build next.</p>
    </div>
    <button class="replay-btn" id="replayBtn">Replay Intro</button>
  </div>

  <div class="intro-layer" id="introLayer">
    <canvas id="logoCanvas"></canvas>
    <div class="hint" id="hint">Click the logo to shatter · <span id="pct">0</span>%</div>
  </div>

  <script>
    const cursorBlob = document.getElementById('cursorBlob');
    let targetX = window.innerWidth * 0.5;
    let targetY = window.innerHeight * 0.5;
    let currentX = targetX;
    let currentY = targetY;
    let mouseX = -9999;
    let mouseY = -9999;

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      targetX = e.clientX + window.innerWidth * 0.15;
      targetY = e.clientY + window.innerHeight * 0.15;
    });

    function animateBg() {
      currentX += (targetX - currentX) * 0.06;
      currentY += (targetY - currentY) * 0.06;
      cursorBlob.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;
      requestAnimationFrame(animateBg);
    }
    animateBg();

    const LOGO_MAP = [
      ".KKKKKKKKKKKKKK....KKKKK.......KKKK..SKKKKKKKKKKKKK.....",
      "SKKKOOOOOOOOOOOOO.SKKKOOOO...SSKKOOOOOKKOOOOOOOOOOOOOO..",
      "SKKKOOOOOOOOOOOOO.SKKKOOOO...SSKKOOOOOKKOOOOOOOOOOOOOO..",
      "SKKKOOOOKKKKKKKOOOOOKKOOOO...SSKKOOOOOKKOOOOOKKKKKKOOOOO",
      "SKKKOOOO...SKKKOOOOOKKOOOO...SSKKOOOOOKKOOOOO..SSKKOOOOO",
      "SKKKOOOO...SKKKOOOOOKKKKOOOOOKKOOOOSSSKKOOOOO..SSKKOOOOO",
      "SKKKOOOO...SKKKOOOOOSSKKOOOOOKKOOOOSSSKKOOOOO..SSKKOOOOO",
      "SKKKOOOOKKKKKKKOOOOOSSKKOOOOOKKOOOOSSSKKOOOOOKKKKKKOOOOO",
      "SKKKOOOOOOOOOOOOO.....SSKKOOOOOOO...SSKKOOOOOOOOOOOOOO..",
      "SKKKOOOOOOOOOOOOO.....KKKKOOOOOOO...SSKKOOOOOOOOOOOOOO..",
      "SKKKOOOO...SKKKOOOOOSSKKOOOOOKKOOOOSSSKKOOOOO..SSKKOOOOO",
      "SKKKOOOO...SKKKOOOOOSSKKOOOOOKKOOOOSSSKKOOOOO..SSKKOOOOO",
      "SKKKOOOO...SKKKOOOOOKKOOOO..KKKKKOOOOOKKOOOOO..SSKKOOOOO",
      "SKKKOOOO...SKKKOOOOOKKOOOO...SSKKOOOOOKKOOOOO..SSKKOOOOO",
      "SKKKOOOOOOOOOOOOO.SKKKOOOO...SSKKOOOOOKKOOOOOOOOOOOOOO..",
      "SKKKOOOOOOOOOOOOO.SKKKOOOO...SSKKOOOOOKKOOOOOOOOOOOOOO..",
      "SKKKOOOOOOOOOOOOO.SKKKOOOO...SSKKOOOOOKKOOOOOOOOOOOOOO.."
    ];

    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');
    const introLayer = document.getElementById('introLayer');
    const siteLayer = document.getElementById('siteLayer');
    const hint = document.getElementById('hint');
    const pctEl = document.getElementById('pct');
    const replayBtn = document.getElementById('replayBtn');

    const rows = LOGO_MAP.length;
    const cols = LOGO_MAP[0].length;

    const COLORS = {
      O: [255, 92, 20],
      K: [12, 5, 3],
      S: [0, 0, 0]
    };

    let particles = [];
    let clearedCount = 0;
    let autoCompleting = false;
    let startTime = performance.now();

    let cellSize = 10;
    let originX = 0;
    let originY = 0;
    let vw = window.innerWidth;
    let vh = window.innerHeight;
    let dpr = 1;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      vw = window.innerWidth;
      vh = window.innerHeight;
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const maxSize = Math.min(vw * 0.85, 640);
      cellSize = maxSize / cols;
      originX = (vw - cols * cellSize) / 2;
      originY = (vh - rows * cellSize) / 2;
    }

    function initParticles() {
      particles = [];
      clearedCount = 0;
      autoCompleting = false;
      pctEl.textContent = '0';
      hint.style.opacity = '1';
      introLayer.classList.remove('done', 'no-pointer');
      siteLayer.classList.remove('revealed');
      startTime = performance.now();

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = LOGO_MAP[r][c];
          if (ch === '.') continue;
          const distFromCenter = Math.hypot((c - cols / 2) / cols, (r - rows / 2) / rows);
          const angle = Math.random() * Math.PI * 2;
          const scatter = 18 + Math.random() * 42;
          particles.push({
            r, c, type: ch,
            char: Math.random() > 0.5 ? '1' : '0',
            delay: distFromCenter * 1.35 + Math.random() * 0.55,
            duration: 0.7 + Math.random() * 0.5,
            offsetX: Math.cos(angle) * scatter,
            offsetY: Math.sin(angle) * scatter,
            flipTimer: Math.random() * 100,
            flipSpeed: 45 + Math.random() * 70,
            shattered: false,
            vanished: false,
            isBlack: false,
            sx: 0, sy: 0, vx: 0, vy: 0,
            gravity: 0.34 + Math.random() * 0.16,
            noiseSeed: Math.random() * 100
          });
        }
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initParticles();

    function getTurbulence(x, y, t, seed) {
      const n1 = Math.sin(x * 0.02 + t * 0.002 + seed) * Math.cos(y * 0.02 - t * 0.0015);
      return n1 * 0.18;
    }

    function triggerAutoComplete() {
      if (autoCompleting) return;
      autoCompleting = true;
      hint.style.opacity = '0';
      introLayer.classList.add('no-pointer');

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!p.shattered) {
          p.shattered = true;
          p.isBlack = false;
          p.sx = originX + (p.c + 0.5) * cellSize;
          p.sy = originY + (p.r + 0.5) * cellSize;
          p.vx = (Math.random() - 0.5) * 1.4;
          p.vy = Math.random() * 2.2;
          p.gravity = 0.32 + Math.random() * 0.22;
        }
      }

      setTimeout(() => {
        siteLayer.classList.add('revealed');
      }, 450);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (autoCompleting) return;
      const clickX = e.clientX;
      const clickY = e.clientY;
      const baseRadius = Math.max(58, cellSize * 8);
      const burstSeed = Math.random() * 10;
      const biasAngle = Math.random() * Math.PI * 2;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.shattered) continue;
        const bx = originX + (p.c + 0.5) * cellSize;
        const by = originY + (p.r + 0.5) * cellSize;
        const dx = bx - clickX;
        const dy = by - clickY;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);

        const lobe =
          1 +
          0.38 * Math.sin(angle * 3 + burstSeed) +
          0.24 * Math.cos(angle * 5 - burstSeed * 1.7) +
          (Math.random() - 0.5) * 0.28;

        const effectiveRadius = baseRadius * lobe;

        if (dist < effectiveRadius) {
          p.shattered = true;
          p.isBlack = true;
          clearedCount++;
          p.sx = bx;
          p.sy = by;

          const proximity = 1 - dist / effectiveRadius;
          const speed = (1.5 + Math.random() * 7) * (0.45 + proximity);
          const scatterAngle = angle + (Math.random() - 0.5) * 1.4;
          p.vx = Math.cos(scatterAngle) * speed + Math.cos(biasAngle) * (Math.random() * 2);
          p.vy = Math.sin(scatterAngle) * speed + Math.sin(biasAngle) * (Math.random() * 1.5) - Math.random() * 3.5;
          p.gravity = 0.36 + Math.random() * 0.18;
        }
      }

      const pct = Math.min(100, Math.round((clearedCount / particles.length) * 100));
      pctEl.textContent = pct;

      if (clearedCount / particles.length >= 0.8) {
        triggerAutoComplete();
      }
    });

    replayBtn.addEventListener('click', initParticles);

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function render(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.clearRect(0, 0, vw, vh);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `400 ${Math.max(8, cellSize * 1.05)}px 'Departure Mono', ui-monospace, monospace`;

      let activeFalling = 0;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        if (p.shattered) {
          if (p.vanished) continue;

          p.vx = (p.vx + getTurbulence(p.sx, p.sy, now, p.noiseSeed)) * 0.99;
          p.vy += p.gravity;
          p.sx += p.vx;
          p.sy += p.vy;

          if (p.sy >= vh - 4) {
            p.vanished = true;
            continue;
          }

          activeFalling++;
          if (Math.random() < 0.18) p.char = p.char === '0' ? '1' : '0';

          if (p.isBlack) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
          } else {
            const rgb = COLORS[p.type];
            const baseAlpha = p.type === 'S' ? 0.35 : 1;
            ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${baseAlpha})`;
          }

          ctx.fillText(p.char, p.sx, p.sy);
          continue;
        }

        const t = Math.max(0, Math.min(1, (elapsed - p.delay) / p.duration));
        if (t <= 0) continue;

        const eased = easeOutCubic(t);
        const baseX = originX + (p.c + 0.5) * cellSize;
        const baseY = originY + (p.r + 0.5) * cellSize;

        const dx = baseX - mouseX;
        const dy = baseY - mouseY;
        const dist = Math.hypot(dx, dy);
        const hoverForce = dist < 60 ? (1 - dist / 60) : 0;

        if (t < 0.96 || hoverForce > 0.2 || Math.random() < 0.0025) {
          if (now - p.flipTimer > p.flipSpeed) {
            p.char = p.char === '0' ? '1' : '0';
            p.flipTimer = now;
          }
        }

        const x = baseX + p.offsetX * (1 - eased) + (hoverForce > 0 ? (dx / (dist || 1)) * hoverForce * 5 : 0);
        const y = baseY + p.offsetY * (1 - eased) + (hoverForce > 0 ? (dy / (dist || 1)) * hoverForce * 5 : 0);

        const rgb = COLORS[p.type];
        const baseAlpha = p.type === 'S' ? 0.35 : 1;
        const alpha = baseAlpha * Math.min(1, t * 1.6);

        if (t < 0.92 && p.type === 'O') {
          ctx.fillStyle = `rgba(255, 175, 90, ${alpha})`;
        } else {
          ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
        }

        ctx.fillText(p.char, x, y);
      }

      if (autoCompleting && activeFalling === 0) {
        introLayer.classList.add('done');
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
